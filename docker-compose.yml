services:
  backend:
    build: ./backend
    container_name: colonial-art-backend
    volumes:
      - ./backend:/app
      # DRIVE_PATH viene del .env en la raíz del proyecto
      - "${DRIVE_PATH}:/app/data/corpus"
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

